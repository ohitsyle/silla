# SILLA — reverse proxy for the single free-tier EC2 instance.
#
# Install to /etc/nginx/conf.d/silla.conf and remove the default server
# block in /etc/nginx/nginx.conf, or this will not be the default host.
#
# NO TLS HERE ON PURPOSE. CloudFront terminates HTTPS and speaks plain
# HTTP to this origin, which is what lets the whole thing have a real
# certificate without owning a domain name. Do not add a self-signed
# cert — CloudFront will refuse it.

upstream silla_server { server 127.0.0.1:4000; keepalive 32; }
upstream silla_vendor { server 127.0.0.1:4100; keepalive 32; }

# Needed for the WebSocket upgrade below: maps the incoming Upgrade
# header to the right Connection value, and sends "close" when there
# is no upgrade rather than a stray "upgrade".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    # The visitor's address is worked out by the APPS, not here.
    #
    # This block used to rewrite $remote_addr from X-Forwarded-For while
    # trusting every address on earth (set_real_ip_from 0.0.0.0/0 with
    # real_ip_recursive on). That walks the header to its LEFTMOST entry —
    # the one the visitor typed themselves, since CloudFront appends to
    # whatever header arrives — so anyone could pick their own address and
    # step around every per-IP limit with a forged header.
    #
    # Now nginx only appends what it actually saw (CloudFront's edge) and
    # both Express apps trust exactly the two hops in front of them
    # (TRUST_PROXY_HOPS, default 2: CloudFront, then this nginx). Entries
    # further left are ignored. That holds only while port 80 is reachable
    # from CloudFront alone — see "Client addresses" in
    # docs/INF-5-aws-deployment.md.

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;

    client_max_body_size 2m;   # a provisioning profile is small; nothing here uploads files

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    # No X-Real-IP: $remote_addr is CloudFront's edge now, and a header
    # named "real IP" holding the wrong one is a trap for whoever reads
    # it next. The apps read X-Forwarded-For through trust proxy instead.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;   # CloudFront already terminated TLS

    # ---- Socket.io (MAP-2, the live map) ----
    # This block MUST come with the upgrade headers. Without them the
    # handshake succeeds over long-polling and then every WebSocket
    # upgrade fails, so the map silently stops updating while the rest
    # of the app looks perfectly healthy.
    location /socket.io/ {
        proxy_pass http://silla_server;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout  3600s;   # default 60s would drop idle sockets every minute
        proxy_send_timeout  3600s;
    }

    # ---- The control plane: never from the internet ----
    # SILLA's commerce API calls the product's /api/internal/ directly on
    # 127.0.0.1:4000 (SERVER_INTERNAL_URL), so nothing legitimate ever
    # arrives here for it. Every request is HMAC-signed and that signature
    # is the real control (server/src/lib/controlPlane.js); this refusal is
    # defence in depth, so a leaked secret is not also an open door.
    # ^~ so no regex location added later can outrank it.
    location ^~ /api/internal/ {
        default_type application/json;
        return 404 '{"error":"Not found"}';
    }

    # ---- The commerce API ----
    # Longest-prefix wins in nginx, so this is matched before /api/ below.
    # vendor/ mounts /api/vendor/auth, /api/vendor/orders and
    # /api/vendor/health — nothing else.
    location /api/vendor/ {
        proxy_pass http://silla_vendor;
    }

    # ---- The product API ----
    # /api/auth, /api/admin, /api/floors, /api/checkin, /api/registration,
    # /api/reservations, /api/resources, /api/organizations, /api/spaces,
    # /api/health — everything except /api/internal/, refused above
    location /api/ {
        proxy_pass http://silla_server;
    }

    # Nothing else is served from this box — the two SPAs live in S3
    # behind their own CloudFront distributions.
    location / {
        return 404 '{"error":"Not found"}';
        add_header Content-Type application/json always;
    }
}
