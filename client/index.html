<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SILLA</title>
    <!--
      A neutral placeholder icon, replaced at runtime by one drawn from
      the organization's own branding (see theme/applyOrgTheme.js). It
      exists so the browser never falls back to /favicon.ico, which does
      not exist and logged a 404 on every page load. Deliberately NOT
      the vendor's mark: this page is a buyer's deployment, and shipping
      a SILLA icon here would put our brand in their browser tab for the
      moment before config arrives.
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23222741'/%3E%3C/svg%3E"
    />
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
